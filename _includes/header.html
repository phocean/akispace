<header id="header">
  <div class="header-inner">
    <a class="brand" href="{{ site.baseurl }}">
      <img src="/img/akispace.svg" alt="Akispace.net" width="312" height="53">
    </a>

    <!-- Nav pages (desktop) -->
    <nav id="nav-links" aria-label="メニュー">
      {% assign pages = site.pages | sort:"weight" %}
      {% for p in pages %}
        {% if p.layout == "page" and p.entry %}
          <a href="{% if site.baseurl == "/" %}{{ p.url }}{% else %}{{ p.url | prepend: site.baseurl }}{% endif %}"
             class="{% if p.url == page.url %}here{% endif %}{% if p.nav_cta %} cta{% endif %}"
             {% if p.url == page.url %}aria-current="page"{% endif %}>{{ p.entry_ja | default: p.entry }}</a>
        {% endif %}
      {% endfor %}

      <!-- Nav links -->
      {% include link.html %}
    </nav>

    <!-- Menu button (mobile) -->
    <button type="button" id="nav-toggle" aria-controls="nav" aria-expanded="false">
      <span class="menu-icon" aria-hidden="true"><i></i><i></i><i></i></span>
      メニュー
    </button>
  </div>
</header>
